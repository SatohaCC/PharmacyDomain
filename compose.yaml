services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pharmacydomain}
      POSTGRES_USER: ${POSTGRES_USER:-pharmacydomain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pharmacydomain-dev-password}
    ports:
      # 開発機のループバックにだけ公開する。0.0.0.0 に開くと同一ネットワークから
      # 開発用資格情報で接続できてしまう。
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pharmacydomain} -d ${POSTGRES_DB:-pharmacydomain}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://pharmacydomain:pharmacydomain-dev-password@postgres:5432/pharmacydomain}
      # 開発用の固定トークン認証。本番の起動点 (app.main:app) はこれを読まない。
      DEV_ACTOR_TOKEN: ${DEV_ACTOR_TOKEN:-dev-actor-token}
      DEV_ACTOR_ROLE: ${DEV_ACTOR_ROLE:-vendor_system_admin}
      DEV_ACTOR_CORPORATE_ID: ${DEV_ACTOR_CORPORATE_ID:-}
      # 更新は監査の追記を伴い、追記は実在する本人とアカウントの行を要求する
      # （外部キー）。既定値を置くと、存在しない行を指したまま起動して最初の
      # 更新で落ちるので、未設定なら起動時に落とす。
      DEV_ACTOR_PERSON_ID: ${DEV_ACTOR_PERSON_ID:-}
      DEV_ACTOR_ACCOUNT_ID: ${DEV_ACTOR_ACCOUNT_ID:-}
      # 店舗ロール（store_operator / store_viewer）のときだけ必要。
      DEV_ACTOR_STORE_IDS: ${DEV_ACTOR_STORE_IDS:-}
      DEV_ACTOR_PRINCIPAL_ID: ${DEV_ACTOR_PRINCIPAL_ID:-}
    ports:
      # postgres と同じく開発機のループバックにだけ公開する。既知の開発用トークンで
      # 全法人を操作できるので、0.0.0.0 に開くと同一ネットワークから全部触れる。
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations
    # 開発用の起動点。`--factory` なのは、環境変数を読むのを import 時ではなく
    # 呼び出し時にするため。本番イメージの CMD は app.main:app のまま変えない。
    command: >
      uv run --frozen uvicorn --factory
      app.presentational.dev_main:create_dev_app
      --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
