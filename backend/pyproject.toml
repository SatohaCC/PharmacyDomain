[project]
name = "pharmacydomain"
version = "0.1.0"
description = "A FastAPI application for PharmacyDomain."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.16,<2.0",
    "asyncpg>=0.30,<1.0",
    "fastapi[standard]>=0.115,<1.0",
    "pydantic>=2.11,<3.0",
    "pyjwt[crypto]>=2.10,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "tzdata>=2026.4",
    "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1.0",
    "import-linter>=2.15",
    "mypy>=2.3,<3.0",
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    # CIワークフローが品質ゲートを全部走らせているかを検証するために使う。
    # 推移的依存としては既に入っているが、テストが依存する以上は明示する。
    "pyyaml>=6.0,<7.0",
    "ruff>=0.16.9,<1.0",
    "types-pyyaml>=6.0,<7.0",
]

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = [
    "graphify-out",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyleのエラー
    "W",      # pycodestyleの警告
    "F",      # 未定義名や未使用import
    "I",      # importの並び順
    "B",      # 誤りやすい構文
    "UP",     # 新しいPython構文への統一
    "C4",     # 内包表記の簡素化
    "SIM",    # 条件分岐等の簡素化
    "TID251", # 指定APIの使用禁止
    "RUF012", # 可変なクラス属性の初期値
    "RUF100", # 不要なnoqa
]
ignore = [
    "E501", # 行長はruff formatへ任せる
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api."dataclasses.asdict"]
msg = "公開JSONや辞書への変換に dataclasses.asdict() は使用せず、明示的なマッパーまたは .value 変換を使用してください。"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
# 型注釈の抜けを検出できないと「mypy が通った」という情報に意味が無くなるため strict で運用する。
strict = true

[tool.lcom]
# 1メソッドだけのUseCaseはLCOM4の判定対象から除外する。
paths = ["app/application"]
threshold = 2
min_methods = 2

[tool.fake_rules]
# AGENTS.md の「テストダブルは実装するProtocolの全メンバを上書きする」を実行可能にしたもの。
# Protocolを明示継承したまま上書きし忘れると、Protocol本体の ... を継承して静かに None を返す。
# 本番の永続化アダプタも Protocol を明示継承するので、フェイクと同じ穴が開く。
# Protocol にメンバが増えたとき、Postgres実装が ... を継承して静かに None を返す。
root = "."
paths = [
    "tests/fakes",
    "tests/application/access_helpers.py",
    "app/infrastructure",
    # 参照Boundaryの実アダプタも Protocol を明示継承する。構造的部分型のままだと
    # Protocol にメンバが増えたとき、実アダプタだけが静かに取り残される。
    "app/application/composition",
    # 認証基盤の既定実装も ActorContextProvider を明示継承する。上書きし忘れると
    # 「認証していないのに例外にならず None が返る」経路ができる。
    "app/presentational",
]

[tool.import_rules]
# AGENTS.md の「依存の向き」「Applicationコンテキストの依存」を実行可能な形にしたもの。
# Store / Staff / Patient / Coverage / Reception は CorporateAccessBoundary（Protocol）にだけ依存し、
# 法人コンテキストの実装には依存しない。
root = "."
paths = ["app"]

[tool.import_rules.forbidden]
# 個別Applicationの境界と外部フレームワーク禁止を維持する。
# Domain越境と内部階層はImport Linterの包括契約で検査する。
