[project]
name = "pharmacydomain"
version = "0.1.0"
description = "A FastAPI application for PharmacyDomain."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3,<3.0",
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    # CIワークフローが品質ゲートを全部走らせているかを検証するために使う。
    # 推移的依存としては既に入っているが、テストが依存する以上は明示する。
    "pyyaml>=6.0,<7.0",
    "ruff>=0.12,<1.0",
    "types-pyyaml>=6.0,<7.0",
]

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = [
    "graphify-out",
]

[tool.ruff.lint]
select = [
    "E4",   # pycodestyle: import and syntax errors
    "E7",   # pycodestyle: statement errors
    "E9",   # pycodestyle: runtime errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "DTZ",  # flake8-datetimez: date.today() / naive datetime.now() を禁止する
            # （AGENTS.md「date.today() を暗黙利用せず、適用日を明示する」）
    "RUF",  # Ruff-specific rules
]
ignore = [
    "RUF001",  # 日本語の文字列に含まれる全角記号を許容する
    "RUF002",  # 日本語の docstring に含まれる全角記号を許容する
    "RUF003",  # 日本語のコメントに含まれる全角記号を許容する
]

[tool.ruff.lint.isort]
known-first-party = [
    "app",
    "tests",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.mypy]
python_version = "3.14"
# 型注釈の抜けを検出できないと「mypy が通った」という情報に意味が無くなるため strict で運用する。
strict = true

[tool.lcom]
# 1メソッドだけのUseCaseはLCOM4の判定対象から除外する。
paths = ["app/application"]
threshold = 2
min_methods = 2

[tool.fake_rules]
# AGENTS.md の「テストダブルは実装するProtocolの全メンバを上書きする」を実行可能にしたもの。
# Protocolを明示継承したまま上書きし忘れると、Protocol本体の ... を継承して静かに None を返す。
root = "."
paths = ["tests/fakes", "tests/application/access_helpers.py"]

[tool.import_rules]
# AGENTS.md の「依存の向き」「Applicationコンテキストの依存」を実行可能な形にしたもの。
# Store / Staff / Patient / Coverage / Reception は CorporateAccessBoundary（Protocol）にだけ依存し、
# 法人コンテキストの実装には依存しない。
root = "."
paths = ["app"]

[tool.import_rules.forbidden]
# Shared Kernel は、それを利用する側のコンテキストに依存しない。
"app.base" = ["app.domain", "app.application", "fastapi", "sqlalchemy"]
# Domain層は Application層・Web/DBフレームワークに一切依存しない。
"app.domain" = ["app.application", "fastapi", "sqlalchemy"]
# 認可基盤は個別コンテキストに依存しない（leafを維持する）。
"app.application.access_control" = [
    "app.application.corporate",
    "app.application.store",
    "app.application.staff",
    "app.application.patient",
    "app.application.coverage",
    "app.application.reception",
    "app.application.composition",
    "app.application.prescription",
    "app.application.dispensing",
    "app.application.medication_history",
    "app.application.medicine_catalog",
]
# Corporate は他のApplicationコンテキストに依存しない。
"app.application.corporate" = [
    "app.application.store",
    "app.application.staff",
    "app.application.patient",
    "app.application.coverage",
    "app.application.reception",
    "app.application.composition",
    "app.application.prescription",
    "app.application.dispensing",
    "app.application.medication_history",
    "app.application.medicine_catalog",
]
# Store は Staff にも法人コンテキストの実装にも依存しない。
"app.application.store" = [
    "app.application.staff",
    "app.application.corporate",
    "app.application.patient",
    "app.application.coverage",
    "app.application.reception",
    "app.application.composition",
    "app.application.prescription",
    "app.application.dispensing",
    "app.application.medication_history",
    "app.application.medicine_catalog",
]
# Staff は法人コンテキストの実装に依存しない（Store への依存は一方向で許可）。
"app.application.staff" = [
    "app.application.corporate",
    "app.application.patient",
    "app.application.coverage",
    "app.application.reception",
    "app.application.composition",
    "app.application.prescription",
    "app.application.dispensing",
    "app.application.medication_history",
    "app.application.medicine_catalog",
]
# Patient は他のApplicationコンテキストに依存しない。
"app.application.patient" = [
    "app.application.corporate",
    "app.application.store",
    "app.application.staff",
    "app.application.coverage",
    "app.application.reception",
    "app.application.composition",
    "app.application.prescription",
    "app.application.dispensing",
    "app.application.medication_history",
    "app.application.medicine_catalog",
]
# Coverage は法人・PatientのApplication実装に依存せず、ID参照と境界Protocolだけを使う。
"app.application.coverage" = [
    "app.application.corporate",
    "app.application.store",
    "app.application.staff",
    "app.application.patient",
    "app.application.reception",
    "app.application.composition",
    "app.application.prescription",
    "app.application.dispensing",
    "app.application.medication_history",
    "app.application.medicine_catalog",
]
# Receptionは他コンテキストのApplication実装へ依存せず、参照Boundaryへ依存する。
"app.application.reception" = [
    "app.application.corporate",
    "app.application.store",
    "app.application.staff",
    "app.application.patient",
    "app.application.coverage",
    "app.application.composition",
    "app.application.prescription",
    "app.application.dispensing",
    "app.application.medication_history",
    "app.application.medicine_catalog",
]
# Prescriptionは他コンテキストのApplication実装へ依存せず、参照Boundaryへ依存する。
"app.application.prescription" = [
    "app.application.corporate",
    "app.application.store",
    "app.application.staff",
    "app.application.patient",
    "app.application.coverage",
    "app.application.reception",
    "app.application.composition",
]
# Dispensingは他コンテキストのApplication実装へ依存せず、参照Boundaryへ依存する。
"app.application.dispensing" = [
    "app.application.corporate",
    "app.application.store",
    "app.application.staff",
    "app.application.patient",
    "app.application.coverage",
    "app.application.reception",
    "app.application.prescription",
    "app.application.composition",
]
# MedicationHistoryは他コンテキストのApplication実装へ依存せず、参照Boundaryへ依存する。
"app.application.medication_history" = [
    "app.application.corporate",
    "app.application.store",
    "app.application.staff",
    "app.application.patient",
    "app.application.coverage",
    "app.application.reception",
    "app.application.prescription",
    "app.application.dispensing",
    "app.application.composition",
]
# 医薬品マスタのApplicationは、どのコンテキストのApplication実装にも依存しない。
"app.application.medicine_catalog" = [
    "app.application.corporate",
    "app.application.store",
    "app.application.staff",
    "app.application.patient",
    "app.application.coverage",
    "app.application.reception",
    "app.application.prescription",
    "app.application.dispensing",
    "app.application.medication_history",
    "app.application.composition",
]
# CoverageはPatientのAggregate/Repositoryを直接参照せず、資格自身のIDと境界だけを扱う。
"app.domain.coverage" = [
    "app.domain.claim",
    "app.domain.reception",
    "app.domain.patient.patient",
    "app.domain.patient.external_identifier",
    "app.domain.patient.repository",
]
# ClaimはCoverage・Patient・Storeの集約やRepositoryを直接参照せず、スナップショットとIDだけを扱う。
"app.domain.claim" = [
    "app.domain.coverage",
    "app.domain.reception",
    "app.domain.patient.patient",
    "app.domain.patient.external_identifier",
    "app.domain.patient.repository",
    "app.domain.store.store",
    "app.domain.store.repository",
]
# ReceptionはClaim Snapshotと共有IDだけを持ち、資格台帳や他集約を直接参照しない。
"app.domain.reception" = [
    "app.domain.coverage",
    "app.domain.patient.patient",
    "app.domain.patient.external_identifier",
    "app.domain.patient.repository",
    "app.domain.store.store",
    "app.domain.store.repository",
]
# Receptionは下流の処方箋・調剤・薬歴に依存しない（逆流の禁止）。
"app.domain.reception.coverage_selection_record" = ["app.domain.prescription"]
# 処方箋は下流コンテキストと資格台帳の集約・リポジトリを直接参照しない。
# 他コンテキストの primitives（ID）は既存の Coverage→Patient と同じく許可する。
"app.domain.prescription" = [
    "app.domain.dispensing",
    "app.domain.medication_history",
    "app.domain.claim",
    "app.domain.coverage",
    "app.domain.patient.patient",
    "app.domain.patient.external_identifier",
    "app.domain.patient.repository",
    "app.domain.store.store",
    "app.domain.store.repository",
    "app.domain.staff.staff",
    "app.domain.staff.repository",
    "app.domain.reception.coverage_selection_record",
    "app.domain.reception.coverage_selection",
    "app.domain.reception.repository",
]
# 調剤は下流コンテキストと資格台帳へ依存せず、他集約はID・Snapshot・Boundaryで参照する。
# 処方箋については集約そのものを Domain Service が引数で受け取るため、
# パッケージ全体では禁止せず、集約モジュールにだけ禁止を課す（下の行）。
"app.domain.dispensing" = [
    "app.domain.medication_history",
    "app.domain.claim",
    "app.domain.coverage",
    "app.domain.reception",
    "app.domain.patient.patient",
    "app.domain.patient.external_identifier",
    "app.domain.patient.repository",
    "app.domain.store.store",
    "app.domain.store.repository",
    "app.domain.staff.staff",
    "app.domain.staff.repository",
]
# 調剤セッション集約は処方箋集約を参照しない。
# validate() から他集約を読めてしまうと、ロードできない検証を書けてしまう。
"app.domain.dispensing.dispensing_process" = [
    "app.domain.prescription.prescription",
    "app.domain.prescription.repository",
    "app.domain.prescription.services",
]
# 薬歴は下流の請求と資格台帳へ依存せず、上流はIDと集約の引き渡しだけで扱う。
"app.domain.medication_history" = [
    "app.domain.claim",
    "app.domain.coverage",
    "app.domain.reception",
    "app.domain.patient.patient",
    "app.domain.patient.external_identifier",
    "app.domain.patient.repository",
    "app.domain.store.store",
    "app.domain.store.repository",
    "app.domain.staff.staff",
    "app.domain.staff.repository",
    "app.domain.dispensing.repository",
    "app.domain.prescription.prescription",
    "app.domain.prescription.repository",
]
# 2つの集約は調剤セッション集約を参照しない。
# validate() から他集約を読めてしまうと、ロードできない検証を書けてしまう。
# 調剤との一致は services.py が本物の集約を引数で受け取って判定する。
"app.domain.medication_history.medication_history_record" = [
    "app.domain.dispensing.dispensing_process",
]
"app.domain.medication_history.patient_medical_profile" = [
    "app.domain.dispensing.dispensing_process",
]
# 医薬品マスタは全コンテキストの下流に置かず、どのコンテキストにも依存しない葉にする。
# 薬価基準は国が定める参照データであり、テナントも患者も処方も知らない。
"app.domain.medicine_catalog" = [
    "app.domain.corporate",
    "app.domain.store",
    "app.domain.staff",
    "app.domain.patient",
    "app.domain.coverage",
    "app.domain.reception",
    "app.domain.claim",
    "app.domain.prescription",
    "app.domain.dispensing",
    "app.domain.medication_history",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# ライブラリ内部から出る非推奨警告を無視する
filterwarnings = [
    "ignore::DeprecationWarning:pytest_asyncio.*",
]
