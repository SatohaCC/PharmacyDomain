# AGENTS.md「コマンド & 品質ゲート」に列挙したコマンドを、push / pull request のたびに実行する。
#
# ここで実行するコマンドの集合と起動条件は tests/tools/test_ci_quality_gate.py が凍結している。
# ゲートを1つ増やす・減らすときは AGENTS.md・このファイル・あの表の3つを揃えないと pytest が落ちる。
name: quality-gate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# 同じ ref への連続 push では、古い実行を打ち切って最新だけを残す。
concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      # astral-sh/setup-uv は v8 以降 vN の浮動タグを打っていないため、正確なバージョンで固定する。
      # 揃えて checkout も固定する。更新は依存の更新として明示的に行う。
      - name: リポジトリを取得する
        uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable

      - name: uv をセットアップする
        uses: astral-sh/setup-uv@v10.0.1
        with:
          # Python のバージョンは backend/.python-version が単一の出所なので、ここでは指定しない。
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: 依存を同期する
        run: pnpm sync:backend

      # 以降のゲートは互いに独立している。1つ落ちても残りを実行し、
      # 1回の push で全部の違反が見えるようにする（`!cancelled()`）。
      - name: テストを実行する（アーキテクチャ規則の検証を含む）
        run: pnpm test:backend

      - name: 型チェックする
        if: ${{ !cancelled() }}
        run: pnpm typecheck:backend

      - name: Lint する
        if: ${{ !cancelled() }}
        run: pnpm lint:backend

      - name: フォーマットを検査する
        if: ${{ !cancelled() }}
        run: pnpm format:check

      - name: レイヤーとコンテキストの依存契約を検査する
        if: ${{ !cancelled() }}
        run: pnpm imports

  # 実PostgreSQLを要するテストは別ジョブにする。DBが無い環境では自動でスキップ
  # されるため、上のジョブでは「実行されたが何も確かめていない」状態になりうる。
  # ここだけがサーバの実挙動（ON CONFLICT、制約名、部分一意インデックス）を見る。
  integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pharmacydomain
          POSTGRES_USER: pharmacydomain
          POSTGRES_PASSWORD: pharmacydomain-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pharmacydomain -d pharmacydomain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: リポジトリを取得する
        uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable

      - name: uv をセットアップする
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: 依存を同期する
        run: pnpm sync:backend

      - name: 実PostgreSQLに対する結合テストを実行する
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://pharmacydomain:pharmacydomain-ci-password@localhost:5432/pharmacydomain
        run: pnpm test:integration

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck:frontend
      - run: pnpm lint:frontend
      - run: pnpm test:frontend
      - run: pnpm build
      - run: pnpm test:e2e:install
      - run: pnpm test:e2e
        timeout-minutes: 3

  storybook:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e:install
      - run: pnpm test:stories
        timeout-minutes: 3
      - run: pnpm build:storybook
        timeout-minutes: 2
