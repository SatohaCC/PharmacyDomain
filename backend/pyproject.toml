    "app.presentational.dependencies",
]
as_packages = false
ignore_imports = ["app.presentational.routers.** -> app.presentational.dependencies"]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
id = "infrastructure-composition"
name = "技術アダプタはDIと起動点へ依存しない"
type = "forbidden"
source_modules = ["app.infrastructure", "app.infrastructure.**"]
forbidden_modules = [
    "app.infrastructure.di",
    "app.infrastructure.di.**",
    "app.bootstrap",
    "app.main",
    "app.dev_main",
]
as_packages = false
ignore_imports = ["app.infrastructure.di.** -> app.infrastructure.di.**"]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
id = "persistence-external"
name = "PostgreSQL永続化は外部データ取得へ依存しない"
type = "forbidden"
source_modules = ["app.infrastructure.postgres", "app.infrastructure.*.postgres"]
forbidden_modules = ["app.infrastructure.prescription.external"]

[[tool.importlinter.contracts]]
id = "payload-mapping"
name = "JSONB変換は具象アダプタに依存しない"
type = "forbidden"
source_modules = ["app.infrastructure.postgres.codec"]
forbidden_modules = ["app.infrastructure", "app.infrastructure.**"]
