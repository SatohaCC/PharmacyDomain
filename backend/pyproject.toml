    # tests/integration/conftest.py が自動で付ける。TEST_DATABASE_URL が無ければ
    # 実行時にスキップされるので、DBの無い環境でも `pytest -q` は緑のまま。
    "integration: 実PostgreSQLへ接続するテスト。",
]

# ライブラリ内部から出る非推奨警告を無視する
filterwarnings = [
    "ignore::DeprecationWarning:pytest_asyncio.*",
]
