[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
id = "domain-layers"
name = "Domainは外側の層を参照しない"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = [
    "app.application",
    "app.infrastructure",
    "app.presentational",
    "app.bootstrap",
    "app.main",
    "app.dev_main",
]

[[tool.importlinter.contracts]]
id = "application-layers"
name = "Applicationは技術実装とHTTP境界を参照しない"
type = "forbidden"
source_modules = ["app.application"]
forbidden_modules = [
    "app.infrastructure",
    "app.presentational",
    "app.bootstrap",
    "app.main",
    "app.dev_main",
]

[[tool.importlinter.contracts]]
id = "presentation-domain"
name = "PresentationはDomainを直接参照しない"
type = "forbidden"
source_modules = ["app.presentational", "app.presentational.**"]
forbidden_modules = ["app.domain", "app.domain.**"]
as_packages = false
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "presentation-infrastructure"
name = "PresentationはInfrastructureを直接参照しない"
type = "forbidden"
source_modules = ["app.presentational", "app.presentational.**"]
forbidden_modules = [
    "app.infrastructure",
    "app.infrastructure.**",
    "app.bootstrap",
    "app.main",
    "app.dev_main",
]
as_packages = false
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "infrastructure-presentation"
name = "InfrastructureはHTTP境界を参照しない"
type = "forbidden"
source_modules = ["app.infrastructure"]
forbidden_modules = ["app.presentational"]

[[tool.importlinter.contracts]]
id = "domain-primitives"
name = "Domainの識別子・例外・プリミティブは上位の責務へ依存しない"
type = "forbidden"
source_modules = ["app.domain.*.exceptions", "app.domain.*.identifiers", "app.domain.*.primitives"]
forbidden_modules = ["app.domain.*.value_objects", "app.domain.*.entities", "app.domain.*.repositories", "app.domain.*.services"]
as_packages = false

[[tool.importlinter.contracts]]
id = "domain-values"
name = "Domainの複合値は上位の責務へ依存しない"
type = "forbidden"
source_modules = ["app.domain.*.value_objects"]
forbidden_modules = ["app.domain.*.entities", "app.domain.*.repositories", "app.domain.*.services"]
as_packages = false

[[tool.importlinter.contracts]]
id = "domain-entities"
name = "Domainのエンティティは上位の責務へ依存しない"
type = "forbidden"
source_modules = ["app.domain.*.entities"]
forbidden_modules = ["app.domain.*.repositories", "app.domain.*.services"]
as_packages = false

[[tool.importlinter.contracts]]
id = "domain-repositories"
name = "DomainのRepositoryの抽象は上位の責務へ依存しない"
type = "forbidden"
source_modules = ["app.domain.*.repositories"]
forbidden_modules = ["app.domain.*.services"]
as_packages = false

[[tool.importlinter.contracts]]
id = "domain-contexts"
name = "Domainコンテキストは公開ID以外で越境しない"
type = "independence"
modules = ["app.domain.*"]
ignore_imports = [
    "app.domain.** -> app.domain.foundation",
    "app.domain.** -> app.domain.foundation.**",
    "app.domain.** -> app.domain.shared",
    "app.domain.** -> app.domain.shared.**",
    "app.domain.** -> app.domain.*.identifiers",
]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
id = "foundation-boundary"
name = "Domain基盤は共有語彙と業務の公開IDにも依存しない"
type = "forbidden"
source_modules = ["app.domain.foundation"]
forbidden_modules = ["app.domain.shared", "app.domain.*.identifiers"]

[[tool.importlinter.contracts]]
id = "application-contexts"
name = "Applicationの業務コンテキストは許可方向だけで依存する"
type = "independence"
modules = [
    "app.application.care_event",
    "app.application.corporate",
    "app.application.coverage",
    "app.application.dispensing",
    "app.application.identity",
    "app.application.medication_history",
    "app.application.medicine_catalog",
    "app.application.patient",
    "app.application.prescription",
    "app.application.reception",
    "app.application.staff",
    "app.application.store",
]
ignore_imports = ["app.application.staff.** -> app.application.store.**"]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
id = "presentation-hierarchy"
name = "HTTP境界はルートと注入処理への逆依存を持たない"
type = "forbidden"
source_modules = ["app.presentational", "app.presentational.**"]
forbidden_modules = [
    "app.presentational.routers",
